<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy 27th Birthday Baby✦</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet"/>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:linear-gradient(180deg,#fff7cf,#f8e49a,#ecd17a);
  font-family:'Playfair Display',serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:40px 16px;
  overflow-x:hidden;
}

/* ───── INTRO ───── */
#intro{
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,#fff7cf,#f5e27a);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.booth{text-align:center;font-family:'Special Elite';}

.booth h1{font-size:20px;letter-spacing:3px;}

.booth p{font-size:12px;opacity:.7;margin-top:10px;}

.btn{
  margin-top:20px;
  padding:12px 18px;
  border-radius:30px;
  border:1px solid #2b1f0a;
  background:transparent;
  cursor:pointer;
  font-family:'Dancing Script';
  font-size:16px;
}

/* ───── FLASH ───── */
.flash{
  position:fixed;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
  z-index:9998;
}

.flash.active{animation:flash .4s ease;}

@keyframes flash{
  0%{opacity:0;}
  20%{opacity:1;}
  100%{opacity:0;}
}

/* ───── SCENE ───── */
.scene{
  opacity:0;
  transform:translateY(20px);
  transition:.8s ease;
  width:100%;
  max-width:420px;
}

/* ───── FILM ───── */
.film{
  background:#3b2a0d;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.header{
  text-align:center;
  padding:16px;
  border-bottom:1px solid rgba(255,215,120,.15);
}

.header h1{
  font-family:'Dancing Script';
  color:#f5e27a;
  font-size:26px;
}

/* ───── PHOTO ───── */
.gate{
  position:relative;
  aspect-ratio:1/1;
  background:#0a0806;
  overflow:hidden;
}

.slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition:.25s ease;
}

.slide.active{opacity:1;}

.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
  padding:10px 10px 28px;
  background:#f8f4ea;
  transform:rotate(1deg);
  filter:sepia(15%) contrast(1.05);
}

/* shake */
.jolt{animation:jolt .25s ease;}

@keyframes jolt{
  0%{transform:translateX(0);}
  25%{transform:translateX(-3px);}
  50%{transform:translateX(3px);}
  100%{transform:translateX(0);}
}

/* caption */
.caption{
  text-align:center;
  padding:10px;
  font-family:'Dancing Script';
  color:#f5e27a;
  font-size:16px;
}

/* nav */
.nav{
  display:flex;
  justify-content:center;
  gap:12px;
  padding:12px;
}

.nav button{
  width:36px;height:36px;
  border-radius:50%;
  border:1px solid rgba(255,215,120,.3);
  background:transparent;
  color:#f5e27a;
  cursor:pointer;
}

/* ───── MESSAGE ───── */
.message{
  padding:16px;
  background:#fef6dc;
  color:#1a120b;
}

.message h2{
  font-family:'Special Elite';
  font-size:12px;
  margin-bottom:10px;
}

.message p{
  font-size:14px;
  line-height:1.8;
  white-space:pre-line;
}

/* ───── BUTTON ───── */
.surprise{
  text-align:center;
  margin:18px 0;
}

.surprise button{
  padding:10px 18px;
  border-radius:30px;
  border:1px dashed #c9a843;
  background:transparent;
  font-family:'Dancing Script';
  cursor:pointer;
}

/* ───── CONFETTI FLOWERS ───── */
.flower{
  position:fixed;
  top:-20px;
  font-size:18px;
  animation:fall linear forwards;
  z-index:9999;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

/* ───── MUSIC BUTTON ───── */
.music{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:9999;
}

.music button{
  border:none;
  background:#f5e27a;
  padding:10px 12px;
  border-radius:20px;
  cursor:pointer;
  font-family:'Special Elite';
  font-size:10px;
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_4a3c3c7b1f.mp3?filename=soft-piano-ambient-122573.mp3">
</audio>

<div class="music">
  <button onclick="toggleMusic()">♫ music</button>
</div>

<div class="flash" id="flash"></div>

<!-- INTRO -->
<div id="intro">
  <div class="booth">
    <h1>✦ PHOTOBOOTH ✦</h1>
    <p>ready to print your memory?</p>
    <button class="btn" onclick="start()">click to print</button>
  </div>
</div>

<!-- SCENE -->
<div class="scene" id="scene">

  <div class="film">

    <div class="header">
      <h1>Happy 27th Baby ♡</h1>
    </div>

    <div class="gate" id="gate"></div>

    <div class="caption" id="cap"></div>

    <div class="nav">
      <button onclick="prev()">←</button>
      <button onclick="next()">→</button>
    </div>

    <div class="surprise">
      <button onclick="confetti()">✦ click here for surprise ✦</button>
    </div>

    <div class="message">
      <h2>a long birthday note</h2>
      <p>
Happy 27th birthday baby...

[YOUR FULL LONG MESSAGE IS KEPT HERE — same as yours]
      </p>
    </div>

  </div>
</div>

<script>
const images=[
"images/photo1.jpg",
"images/photo2.jpg",
"images/photo3.jpg",
"images/photo4.jpg",
"images/photo5.jpg"
];

const captions=[
"where it all started ♡",
"soft chaos & laughter",
"your dedication ✦",
"iconic you",
"milestones unlocked ✨"
];

let i=0;
const gate=document.getElementById("gate");
const cap=document.getElementById("cap");
const flash=document.getElementById("flash");
const music=document.getElementById("bgm");

/* build */
function build(){
  gate.innerHTML="";
  images.forEach((src,idx)=>{
    const d=document.createElement("div");
    d.className="slide"+(idx===0?" active":"");
    d.innerHTML=`<img src="${src}">`;
    gate.appendChild(d);
  });
  cap.innerText=captions[0];
}

/* photobooth switch */
function show(n){
  const slides=document.querySelectorAll(".slide");

  flash.classList.add("active");
  gate.classList.add("jolt");

  setTimeout(()=>flash.classList.remove("active"),300);
  setTimeout(()=>gate.classList.remove("jolt"),300);

  slides[i].classList.remove("active");
  i=n;
  slides[i].classList.add("active");
  cap.innerText=captions[i];

  new Audio("https://assets.mixkit.co/sfx/preview/mixkit-camera-shutter-click-1133.mp3").play();
}

function next(){if(i<images.length-1)show(i+1);}
function prev(){if(i>0)show(i-1);}

/* start */
function start(){
  flash.classList.add("active");

  setTimeout(()=>{
    flash.classList.remove("active");
    document.getElementById("intro").style.display="none";
    document.getElementById("scene").style.opacity="1";
  },700);
}

/* music */
function toggleMusic(){
  if(music.paused) music.play();
  else music.pause();
}

/* flower confetti */
function confetti(){
  const emojis=["🌸","🌼","🌷","💛","✦","♡"];

  for(let i=0;i<40;i++){
    const f=document.createElement("div");
    f.className="flower";
    f.innerText=emojis[Math.floor(Math.random()*emojis.length)];
    f.style.left=Math.random()*100+"vw";
    f.style.animationDuration=(2+Math.random()*3)+"s";
    document.body.appendChild(f);

    setTimeout(()=>f.remove(),5000);
  }
}

build();
</script>

</body>
</html>
